<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guide video</title>
<!--
  guide-video template. Edit THEME and PAGES below; everything else is the engine.
  Every frame is a pure function of time: window.seek(t) renders second t exactly.
  Preview in a browser with  index.html?play   (loops in real time)
                         or  index.html?t=12.5 (one frame)
-->
<style>
:root{--fg:#f2f3f7;--mfg:rgba(242,243,247,.62);--line:rgba(255,255,255,.12);--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--font:-apple-system,"SF Pro Display","Segoe UI","Helvetica Neue",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d0f14}
body{font-family:var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.page{position:absolute;inset:0;overflow:hidden;visibility:hidden;transform-origin:50% 50%}
.page .glow{position:absolute;width:1400px;height:1400px;border-radius:50%;right:-460px;top:-560px;opacity:.55}
.plab{position:absolute;left:126px;top:116px;font-family:var(--mono);font-size:19px;letter-spacing:.16em;color:var(--mfg)}
.pnum{position:absolute;left:120px;top:150px;font-size:150px;font-weight:700;letter-spacing:-.05em;line-height:1;transform-origin:0 0}
.ptit{position:absolute;left:120px;top:330px;width:500px;font-size:62px;font-weight:600;letter-spacing:-.03em;line-height:1.06}
.cov .ptit{font-size:74px;width:560px;line-height:1.02}.stp{display:flex;align-items:center;gap:22px;height:72px;border-top:1px solid var(--line);font-size:25px}.stp:first-child{border-top:0}.stp b{font:600 19px var(--mono);color:#ff9f5a;width:34px}.stp i{margin-left:auto;font-style:normal;font-size:15px;color:var(--mfg);font-family:var(--mono)}
.pdesc{position:absolute;left:123px;width:480px;font-size:27px;font-weight:300;line-height:1.45;color:var(--mfg)}
.box{position:absolute;left:680px;top:150px;width:1140px;height:720px;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.4)}
.box.pad{padding:44px}
/* browser window around a screenshot */
.win{position:absolute;inset:0;background:#0b0c10}
.win .bar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 18px;background:rgba(255,255,255,.06);border-bottom:1px solid var(--line)}
.win .bar i{width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.18)}
.win .url{margin-left:18px;height:28px;flex:0 1 560px;border-radius:14px;background:rgba(255,255,255,.08);font:15px var(--mono);color:var(--mfg);display:flex;align-items:center;padding:0 14px;white-space:nowrap;overflow:hidden}
.win .vp{position:absolute;left:0;right:0;top:46px;bottom:0;overflow:hidden}
.win .cam{position:absolute;left:0;top:0;transform-origin:0 0}
.win .cam img{position:absolute;left:0;top:0;display:block}
.mark{position:absolute;border:3px solid #ffd166;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.0)}
.mark b{position:absolute;left:-3px;top:-44px;height:34px;padding:0 12px;border-radius:8px;background:#ffd166;color:#111;font:600 17px var(--font);display:flex;align-items:center;white-space:nowrap}
.veil{position:absolute;border-radius:6px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);background:rgba(20,22,28,.35)}
.typed{position:absolute;font-size:15px;color:#111;white-space:nowrap;display:flex;align-items:center;padding:0 10px}
/* code */
.ed{position:absolute;left:0;right:0;top:0;height:450px;background:#0f1117}
.ed .tab{height:44px;display:flex;align-items:center;padding:0 20px;font:16px var(--mono);color:var(--mfg);border-bottom:1px solid var(--line)}
.ed pre,.term pre{font:21px/1.72 var(--mono);white-space:pre;padding:20px 26px;position:absolute;left:0;right:0}
.ed pre{top:44px}
.ln{color:rgba(255,255,255,.25);display:inline-block;width:34px;margin-right:18px;text-align:right}
.kw{color:#c792ea}.st{color:#ffcb6b}.fn{color:#82aaff}.cm{color:rgba(255,255,255,.38)}.nu{color:#f78c6c}.jk{color:#89ddff}
.term{position:absolute;left:0;right:0;top:450px;bottom:0;background:#08090c;border-top:1px solid var(--line);overflow:hidden}
.term .ttl{height:36px;display:flex;align-items:center;padding:0 20px;font:14px var(--mono);letter-spacing:.12em;color:var(--mfg)}
.term pre{top:36px;font-size:19px;line-height:1.6;padding-top:6px}
.caret{display:inline-block;width:2px;height:24px;background:#fff;vertical-align:-5px;margin-left:1px}
/* cards */
.row{display:flex;align-items:center;justify-content:space-between;height:74px;border-top:1px solid var(--line);font-size:24px}
.row:first-child{border-top:0}
.k{color:var(--mfg);font-size:20px}
.pill{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:19px;font-size:19px;border:1px solid}
.ok{color:#5ee0a0;background:rgba(62,207,142,.14);border-color:rgba(62,207,142,.4)}
/* chrome */
#next{position:absolute;left:0;top:0;width:112px;height:112px;margin:-56px;border-radius:56px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;letter-spacing:-.03em;visibility:hidden;z-index:10}
#next .ring{position:absolute;inset:-10px;border-radius:66px;border:2px solid rgba(255,255,255,.35)}
#fly{position:absolute;left:0;top:0;font-size:150px;font-weight:700;letter-spacing:-.05em;line-height:1;transform-origin:0 0;visibility:hidden;z-index:11}
#cursor{position:absolute;left:0;top:0;width:34px;height:34px;transform-origin:4px 3px;visibility:hidden;z-index:20}
#rip{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid #fff;visibility:hidden;z-index:19}
.term.full{top:0}
.term.full pre{font-size:27px;line-height:1.75;padding:30px 38px}
.term .ok{color:#5ee0a0}.term .mu{color:rgba(255,255,255,.45)}.term .pr{color:#ff9f5a}
.chat{background:#0e0d12}
.chat .ctop{height:46px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);font:15px var(--mono);color:var(--mfg)}
.chat .ctop b{width:10px;height:10px;border-radius:5px;background:#d97757}
.chat .cin{position:absolute;left:0;right:0;top:46px;bottom:0;padding:30px 38px;font:22px/1.65 var(--mono);color:#e8e6e3;white-space:pre-wrap;overflow:hidden}
.chat .you{color:#fff;background:rgba(255,255,255,.07);border-radius:10px;padding:12px 16px;margin-bottom:18px;display:block}
.chat .you i{color:#d97757;font-style:normal}
.chat .dot{color:#d97757}.chat .tool{color:#8fbcff}.chat .res{color:rgba(255,255,255,.5)}.chat code{color:#ffcb6b}.chat strong{color:#fff}
</style>
</head>
<body>
<div id="pages"></div>
<div id="next"><i class="ring"></i><span id="nextN"></span></div>
<div id="fly"></div>
<div id="rip"></div>
<svg id="cursor" viewBox="0 0 30 30"><path d="M4 3l0 20 5.6-5.2 3.9 8.4 3.4-1.6-3.9-8.3 7.6-.5z" fill="#fff" stroke="#0d0f14" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script>
/* =====================================================================
   CONTENT — replace everything in this block
   ===================================================================== */
const THEME={
  /* one background per page; neighbours should differ so the expanding circle reads */
  pages:[['#11131a','#3b5bdb'],['#1a1d3d','#7c5cff'],['#0f2a22','#20c997'],['#2b1218','#ff6b6b'],['#111614','#3ecf8e']],
  doneLabel:'DONE'
};
/* A placeholder image so the template renders before real screenshots exist. */
const PLACEHOLDER='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><rect width="1440" height="900" fill="#f4f5f8"/><rect width="240" height="900" fill="#e6e8ee"/><rect x="290" y="60" width="420" height="36" rx="8" fill="#c9cdd8"/><rect x="290" y="140" width="1090" height="300" rx="14" fill="#fff" stroke="#d9dce4"/><rect x="1180" y="60" width="200" height="44" rx="10" fill="#4f6bed"/><text x="720" y="640" font-family="sans-serif" font-size="34" fill="#9aa0ad" text-anchor="middle">screenshot goes here</text></svg>`);

const PAGES=[
  { title:'Step one title', desc:'One sentence on what this step achieves.',
    body:{type:'shot', src:PLACEHOLDER, w:1440, h:900, url:'app.example.com/settings'},
    actions:[ {do:'box', x:1180,y:60,w:200,h:44, label:'Click here'}, {do:'click', x:1280,y:82} ] },
  { title:'Step two title', desc:'Zoom into the part that matters, hide anything secret.',
    body:{type:'shot', src:PLACEHOLDER, w:1440, h:900, url:'app.example.com/keys'},
    actions:[ {do:'zoom', x:290,y:140,w:1090,h:300}, {do:'type', x:310,y:170,w:500,h:44, text:'Typed value', bg:'#fff'},
              {do:'veil', x:600,y:300,w:500,h:60}, {do:'zoom'} ] },
  { title:'Step three title', desc:'Code is typed, run, and its output appears.',
    body:{type:'code', file:'main.js', code:`// replace with the real snippet\nconst res = await fetch(url, { headers });\nconst data = await res.json();\nconsole.log(data);`,
          run:'node main.js', output:`{\n  "status": "ok"\n}`} },
  { title:'Done', desc:'A short recap of what the viewer can now do.', done:true,
    body:{type:'card', html:`<div class="row"><span>Step one</span><span class="pill ok">Done</span></div><div class="row"><span>Step two</span><span class="pill ok">Done</span></div><div class="row"><span>Step three</span><span class="pill ok">Done</span></div>`} }
];

/* =====================================================================
   ENGINE
   ===================================================================== */
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const outQuart=x=>1-Math.pow(1-clamp(x),4);
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
/* closed-form damped spring step response; x in seconds */
function spr(x,w=12,z=.85){if(x<=0)return 0;if(z>=1)return 1-Math.exp(-w*x)*(1+w*x);const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+z*w/wd*Math.sin(wd*x))}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

const BOX={x:680,y:150,w:1140,h:720},BAR=46,BTN=[1830,985];
const steps=PAGES.filter(p=>!p.done&&!p.cover).length;

/* ---- timing: every page's length comes from its content ---- */
const CPS_AI=95;const INTRO=1.25,HOLD=1.3,CPS_CODE=38,CPS_TYPE=16,CPS_CMD=28;
function actDur(a){switch(a.do){
  case'click':return 1.15;case'box':return 1.1;case'zoom':return 1.25;case'veil':return .5;case'swap':return .8;case'wait':return a.s;
  case'type':return .5+a.text.length/CPS_TYPE;default:return .8}}
let T=0;const PG=PAGES.map((p,k)=>{
  const g={k,start:T,acts:[]};let t=T+INTRO;
  if(p.body.type==='term'){g.lines=[];for(const L of p.body.lines){g.lines.push(t);t+=L.cmd?.35+L.cmd.length/CPS_CMD+.5:.16}t+=1.6}
  if(p.body.type==='chat'){g.msgs=[];for(const m of p.body.msgs){g.msgs.push(t);t+=m.role==='user'?.3+m.text.length/CPS_TYPE*.55+.7:m.text.length/CPS_AI+1.4}}
  if(p.body.type==='code'){const c=p.body;g.codeAt=t;t+=c.code.length/CPS_CODE+.6;g.runAt=t;t+=.4+c.run.length/CPS_CMD+.7;g.outAt=t;t+=c.output.split('\n').length*.06+1.4}
  for(const a of p.actions||[]){g.acts.push({...a,t});t+=actDur(a)}
  g.end=t+HOLD+(p.done?1.6:0);T=g.end;return g});
const CLICK=PG.slice(0,-1).map(g=>g.end);                  /* tapping the corner button opens page k+1 */
PG.forEach((g,k)=>{if(k>0)g.start=CLICK[k-1]});
window.DURATION=PG[PG.length-1].end+.6;

/* ---- build DOM ---- */
let n=0;
$('pages').innerHTML=PAGES.map((p,k)=>{
  const [bg,glow]=THEME.pages[k%THEME.pages.length];
  if(!p.done&&!p.cover)n++;
  p.num=p.cover?'':p.done?'✓':String(n).padStart(2,'0');p.lab=p.cover?(p.label||''):p.done?THEME.doneLabel:`STEP ${n} OF ${steps}`;p.bg=bg;
  let body='';const b=p.body;
  if(b.type==='shot'){body=`<div class="box"><div class="win"><div class="bar"><i></i><i></i><i></i><span class="url">${esc(b.url||'')}</span></div><div class="vp"><div class="cam" id="cam${k}"><img id="img${k}" src="${b.src}" width="${b.w}" height="${b.h}">${(p.actions||[]).map((a,i)=>a.do==='swap'?`<img id="sw${k}_${i}" src="${a.src}" width="${b.w}" height="${b.h}" style="opacity:0">`:'').join('')}${(p.actions||[]).map((a,i)=>
      a.do==='box'?`<div class="mark" id="mk${k}_${i}" style="left:${a.x-6}px;top:${a.y-6}px;width:${a.w+12}px;height:${a.h+12}px">${a.label?`<b>${esc(a.label)}</b>`:''}</div>`:
      a.do==='veil'?`<div class="veil" id="vl${k}_${i}" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px"></div>`:
      a.do==='type'?`<div class="typed" id="ty${k}_${i}" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;background:${a.bg||'transparent'};color:${a.color||'#111'};font-size:${a.size||15}px"></div>`:'').join('')}</div></div></div></div>`}
  else if(b.type==='term'){body=`<div class="box"><div class="term full"><div class="ttl">TERMINAL</div><pre id="tx${k}"></pre></div></div>`}
  else if(b.type==='chat'){body=`<div class="box chat"><div class="ctop"><b></b>${esc(b.title||'Claude Code')}</div><div class="cin" id="cx${k}"></div></div>`}
  else if(b.type==='code'){body=`<div class="box"><div class="ed"><div class="tab">${esc(b.file||'')}</div><pre id="code${k}"></pre></div><div class="term"><div class="ttl">TERMINAL</div><pre id="term${k}"></pre></div></div>`}
  else body=`<div class="box pad">${b.html}</div>`;
  return `<div class="page${p.cover?' cov':''}" id="pg${k}" style="background:${bg}"><div class="glow" style="background:radial-gradient(circle,${glow}55,transparent 62%)"></div>
    <div class="plab" id="lb${k}">${p.lab}</div><div class="pnum" id="nm${k}">${p.cover&&p.mark?p.mark:p.num}</div><div class="ptit" id="tt${k}">${p.titleHtml||esc(p.title)}</div><div class="pdesc" id="ds${k}">${esc(p.desc||'')}</div>${body}</div>`}).join('');
/* description sits under however many lines the title wrapped to */
PAGES.forEach((p,k)=>{const r=$('tt'+k).getBoundingClientRect();$('ds'+k).style.top=(r.bottom+26)+'px'});
const NUMPOS=(()=>{const r=$('nm0').getBoundingClientRect();return[r.left,r.top]})();
const RMAX=Math.hypot(BTN[0],BTN[1])+40;

/* ---- screenshot camera: fit, then optional zoom onto a region ---- */
const VP={w:BOX.w,h:BOX.h-BAR};
function camAt(k,t){const p=PAGES[k],b=p.body,fit=Math.min(VP.w/b.w,VP.h/b.h);
  let s=fit,x=(VP.w-b.w*fit)/2,y=(VP.h-b.h*fit)/2;
  for(const a of PG[k].acts){if(a.do!=='zoom')continue;const m=spr(t-a.t,7,.95);
    let ts,tx,ty;if(a.w){ts=Math.min(VP.w/a.w,VP.h/a.h)*.92;tx=VP.w/2-(a.x+a.w/2)*ts;ty=VP.h/2-(a.y+a.h/2)*ts;
      /* keep the screenshot covering the viewport: never pan past its edges */
      tx=b.w*ts>=VP.w?clamp(tx,VP.w-b.w*ts,0):(VP.w-b.w*ts)/2;ty=b.h*ts>=VP.h?clamp(ty,VP.h-b.h*ts,0):(VP.h-b.h*ts)/2}
    else{ts=fit;tx=(VP.w-b.w*fit)/2;ty=(VP.h-b.h*fit)/2}
    s=lerp(s,ts,m);x=lerp(x,tx,m);y=lerp(y,ty,m)}
  return{s,x,y}}
const shotToScreen=(k,t,px,py)=>{const c=camAt(k,t);return[BOX.x+c.x+px*c.s,BOX.y+BAR+c.y+py*c.s]};

/* ---- code highlighting ---- */
const KW=/^(const|let|var|await|async|function|return|import|from|export|if|else|for|while|new|try|catch|def|class|print|curl|true|false|null|None)$/;
function tokens(src){const out=[];const re=/(\/\/[^\n]*|#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)|([\s\S])/g;let m;
  while((m=re.exec(src))){if(m[1])out.push(['cm',m[1]]);else if(m[2])out.push(['st',m[2]]);else if(m[3])out.push(['nu',m[3]]);else if(m[4])out.push([KW.test(m[4])?'kw':'fn',m[4]]);else if(m[5])out.push([KW.test(m[5])?'kw':'',m[5]]);else out.push(['',m[6]])}return out}
function codeHTML(src,n,caret){const tk=tokens(src);let out='',left=n;for(const[c,s]of tk){if(left<=0)break;const p=s.slice(0,left);left-=p.length;out+=c?`<span class="${c}">${esc(p)}</span>`:esc(p)}
  const lines=out.split('\n');return lines.map((l,i)=>`<span class="ln">${i+1}</span>${l}${caret&&i===lines.length-1?'<span class="caret"></span>':''}`).join('\n')}
const jsonHTML=s=>esc(s).replace(/("[^"]*")(\s*:)/g,'<span class="jk">$1</span>$2').replace(/:\s*("[^"]*")/g,': <span class="st">$1</span>').replace(/:\s*(-?\d+(?:\.\d+)?)/g,': <span class="nu">$1</span>');
const SPIN='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
const lastIdx=(arr,t)=>{let j=-1;arr.forEach((s,i)=>{if(t>=s)j=i});return j};
/* tiny formatter for AI replies: ⏺ bullets, tool calls, results, `code`, **bold** */
const fmtAI=s=>esc(s).split('\n').map(l=>{l=l.replace(/`([^`]*)`?/g,'<code>$1</code>').replace(/\*\*([^*]*)\*?\*?/g,'<strong>$1</strong>');
  if(/^⏺ (Bash|Read|Fetch|Skill)\(/.test(l))return l.replace(/^⏺ /,'<span class="dot">⏺</span> <span class="tool">')+'</span>';
  if(l.startsWith('⏺'))return l.replace('⏺','<span class="dot">⏺</span>');if(/^\s*⎿/.test(l))return `<span class="res">${l}</span>`;return l}).join('\n');

/* =====================================================================
   RENDER — a pure function of t (seconds)
   ===================================================================== */
function render(t){
  PAGES.forEach((p,k)=>{
    const el=$('pg'+k),g=PG[k],s0=g.start;
    if(t<s0){el.style.visibility='hidden';return}
    el.style.visibility='visible';el.style.zIndex=k;
    if(k>0){const e=outQuart((t-s0)/1.05);el.style.clipPath=e<1?`circle(${lerp(56,RMAX,e).toFixed(1)}px at ${BTN[0]}px ${BTN[1]}px)`:'none'}
    const nx=k<PAGES.length-1?outQuart((t-CLICK[k])/1.05):0;
    el.style.transform=`scale(${(1-.06*nx).toFixed(4)})`;el.style.filter=nx>0?`brightness(${(1-.45*nx).toFixed(3)})`:'none';
    if(nx>=1){el.style.visibility='hidden';return}
    const enter=(e,d,dy=40)=>{const s=spr(t-s0-d,11,.86);e.style.opacity=clamp(s*1.3);e.style.translate=`0 ${((1-s)*dy).toFixed(2)}px`;e.style.filter=s<.98?`blur(${((1-clamp(s))*8).toFixed(2)}px)`:'none'};
    const base=k===0?.2:.3;
    enter($('lb'+k),base);enter($('tt'+k),base+.12);enter($('ds'+k),base+.24);enter(el.querySelector('.box'),base+.36,60);
    $('nm'+k).style.opacity=k===0?clamp(spr(t-.1,10,.9)*1.3):(t-s0>=.78?1:0);
    const b=p.body;
    if(b.type==='shot'){
      const c=camAt(k,t);$('cam'+k).style.transform=`translate(${c.x.toFixed(2)}px,${c.y.toFixed(2)}px) scale(${c.s.toFixed(5)})`;
      g.acts.forEach((a,i)=>{const d=t-a.t;
        if(a.do==='box'){const e=$(`mk${k}_${i}`),s=spr(d,12,.7),out=1-ease((t-(g.end-.35))/.3);e.style.opacity=clamp(s*1.5)*out;e.style.transform=`scale(${(1.12-.12*clamp(s,0,1.2)).toFixed(4)})`;e.style.borderWidth=(3/c.s).toFixed(2)+'px';const lb=e.querySelector('b');if(lb){lb.style.transform=`scale(${(1/c.s).toFixed(4)})`;lb.style.transformOrigin='0 100%';lb.style.top=(-44/c.s)+'px'}}
        if(a.do==='veil')$(`vl${k}_${i}`).style.opacity=a.from===0?1:ease(d/.3);
        if(a.do==='type'){const e=$(`ty${k}_${i}`);e.style.opacity=d>=0?1:0;const n=Math.round(clamp((d-.35)/(a.text.length/CPS_TYPE))*a.text.length);e.innerHTML=esc(a.text.slice(0,n))+(d>=0&&d<actDur(a)+.4?'<span class="caret" style="background:currentColor;height:1.1em"></span>':'')}
        if(a.do==='swap')$(`sw${k}_${i}`).style.opacity=ease(d/.35)});
    }
    if(b.type==='term'){let out='';b.lines.forEach((L,i)=>{const s=g.lines[i];if(t<s)return;
        if(L.cmd){const n=Math.round(clamp((t-s-.3)/(L.cmd.length/CPS_CMD))*L.cmd.length);const typing=n<L.cmd.length||t<s+.35+L.cmd.length/CPS_CMD+.5;
          out+=`<span class="pr">$</span> ${esc(L.cmd.slice(0,n))}${typing&&i===lastIdx(g.lines,t)?'<span class="caret"></span>':''}\n`}
        else out+=`<span class="${L.cls||''}">${esc(L.out)}</span>\n`});$('tx'+k).innerHTML=out}
    if(b.type==='chat'){let out='';b.msgs.forEach((m,i)=>{const s=g.msgs[i];if(t<s)return;
        if(m.role==='user'){const n=Math.round(clamp((t-s-.2)/(m.text.length/CPS_TYPE*.55))*m.text.length);out+=`<span class="you"><i>&gt;</i> ${esc(m.text.slice(0,n))}${n<m.text.length?'<span class="caret"></span>':''}</span>`}
        else{const n=Math.floor(clamp((t-s)/(m.text.length/CPS_AI))*m.text.length);out+=fmtAI(m.text.slice(0,n))}});$('cx'+k).innerHTML=out}
    if(b.type==='code'){
      const n=Math.round(clamp((t-g.codeAt)/(b.code.length/CPS_CODE))*b.code.length);$('code'+k).innerHTML=codeHTML(b.code,n,t<g.runAt);
      const cn=Math.round(clamp((t-g.runAt-.3)/(b.run.length/CPS_CMD))*b.run.length);
      let term=t>=g.runAt?`<span style="color:#5ee0a0">$</span> ${esc(b.run.slice(0,cn))}`:'';
      if(t>=g.runAt&&t<g.outAt)term+=cn<b.run.length?'<span class="caret"></span>':`\n<span style="color:var(--mfg)">${SPIN[Math.floor(t*12)%10]} running…</span>`;
      if(t>=g.outAt){const L=b.output.split('\n');term+='\n'+jsonHTML(L.slice(0,Math.floor((t-g.outAt)/.06)+1).join('\n'))}
      $('term'+k).innerHTML=term}
  });

  /* corner button: pops in near the end of a page, gets pressed, becomes the circle */
  { let k=-1;for(let i=0;i<CLICK.length;i++)if(t>=PG[i].start&&t<CLICK[i]+.02)k=i;
    const B=$('next');
    if(k<0)B.style.visibility='hidden';else{
      const nxt=PAGES[k+1],popAt=Math.max(PG[k].start+1.1,CLICK[k]-2.2),pop=spr(t-popAt,11,.62),press=Math.exp(-Math.pow((t-CLICK[k]+.06)/.09,2));
      B.style.visibility=pop>.002?'visible':'hidden';B.style.background=nxt.bg;$('nextN').textContent=nxt.num.replace(/^0/,'');
      B.style.transform=`translate(${BTN[0]}px,${BTN[1]}px) scale(${(clamp(pop,0,1.2)*(1-.12*press)).toFixed(4)}) rotate(${((1-clamp(pop))*-40).toFixed(2)}deg)`;
      const ph=((t-popAt)%1.6+1.6)%1.6/1.6;B.querySelector('.ring').style.cssText=`opacity:${(.6*(1-ph)*clamp(pop)).toFixed(3)};transform:scale(${(1+ph*.35).toFixed(3)})`}}

  /* the digit on the button flies up and becomes the page number */
  { let k=-1;for(let i=0;i<CLICK.length;i++)if(t>=CLICK[i]&&t<CLICK[i]+.8)k=i;
    const F=$('fly');
    if(k<0)F.style.visibility='hidden';else{
      const nxt=PAGES[k+1],m=spr(t-CLICK[k],8.5,.9),sc0=52/150;
      F.style.visibility='visible';F.style.color='#fff';
      F.innerHTML=/^0/.test(nxt.num)?`<span style="opacity:${clamp(m*1.4).toFixed(3)}">0</span>${nxt.num.slice(1)}`:nxt.num;
      F.style.transform=`translate(${lerp(BTN[0]-26,NUMPOS[0],m).toFixed(2)}px,${lerp(BTN[1]-24,NUMPOS[1],m).toFixed(2)}px) scale(${lerp(sc0,1,m).toFixed(4)})`}}

  /* cursor: every click (in-page and the corner button) is a key; it travels 0.8 s before each */
  { const keys=[[0,[1520,1200]]];
    PG.forEach((g,k)=>{g.acts.forEach(a=>{if(a.do==='click')keys.push([a.t+.8,shotToScreen(k,a.t+.8,a.x,a.y)]);if(a.do==='type')keys.push([a.t+.3,shotToScreen(k,a.t+.3,a.x+a.w*.8,a.y+a.h*.7)])});if(k<CLICK.length)keys.push([CLICK[k]-.05,BTN],[CLICK[k]+.9,[1560,820]])});
    keys.sort((a,b)=>a[0]-b[0]);
    let x=keys[0][1][0],y=keys[0][1][1];
    for(let i=1;i<keys.length;i++){const s=spr(t-(keys[i][0]-.8),9,1);x+=(keys[i][1][0]-keys[i-1][1][0])*s;y+=(keys[i][1][1]-keys[i-1][1][1])*s}
    const presses=[...CLICK,...PG.flatMap(g=>g.acts.filter(a=>a.do==='click').map(a=>a.t+.8))];
    let press=0;for(const c of presses)press=Math.max(press,Math.exp(-Math.pow((t-c+.04)/.09,2)));
    const o=clamp((t-.9)/.4)*(1-clamp((t-(CLICK[CLICK.length-1]+1.2))/.5));
    const C=$('cursor');C.style.visibility=o>0?'visible':'hidden';C.style.opacity=o;C.style.transform=`translate(${(x-4).toFixed(2)}px,${(y-3).toFixed(2)}px) scale(${(1-.16*press).toFixed(4)})`;
    const R=$('rip');let rc=null;for(const c of presses)if(t>=c&&t<c+.6)rc=c;
    if(rc===null)R.style.visibility='hidden';else{const d=t-rc,i=keys.findIndex(q=>Math.abs(q[0]-rc)<.06||Math.abs(q[0]-(rc-.05))<.06);const[px,py]=i>=0?keys[i][1]:[x,y];
      R.style.visibility='visible';R.style.opacity=.7*(1-d/.6);R.style.transform=`translate(${px}px,${py}px) scale(${(1+9*(1-Math.exp(-6*d))).toFixed(3)})`}}
}

window.seek=render;
window.BEATINFO={BPM:60,PHASE:0,BEAT:1,BEATS:Math.ceil(window.DURATION)};    /* lets render.mjs address frames in seconds */
window.SFX=[...CLICK.map(c=>({t:c,k:'click'})),...CLICK.map(c=>({t:c,k:'reveal'})),
  ...PG.flatMap(g=>g.acts.filter(a=>a.do==='click').map(a=>({t:a.t+.8,k:'click'}))),
  ...PG.flatMap(g=>g.acts.filter(a=>a.do==='type').flatMap(a=>Array.from({length:Math.ceil(a.text.length/2)},(_,i)=>({t:a.t+.35+i*2/CPS_TYPE,k:'key'})))),
  ...PG.filter(g=>g.codeAt!==undefined).flatMap(g=>{const c=PAGES[g.k].body.code.length;return Array.from({length:Math.ceil(c/4)},(_,i)=>({t:g.codeAt+i*4/CPS_CODE,k:'key'}))})];
Promise.all([document.fonts.ready,...Array.from(document.images).map(i=>i.decode().catch(()=>{}))]).then(()=>{
  const q=new URLSearchParams(location.search);render(+q.get('t')||0);window.ready=true;
  if(q.has('play')){const t0=performance.now();const loop=()=>{render(((performance.now()-t0)/1000)%window.DURATION);requestAnimationFrame(loop)};loop()}});
</script>
</body>
</html>
